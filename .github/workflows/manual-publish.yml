name: manual-publish

on:
  workflow_dispatch:
    inputs:
      ref_to_publish:
        description: 'Git ref. Stable releases require refs/tags/vX.Y.Z'
        required: true
        type: string
        default: 'refs/heads/main'
      stable_version:
        description: 'Stable release (version must not end in -SNAPSHOT)'
        required: true
        type: boolean
        default: false

jobs:
  publish_sonatype:
    name: Publish to Maven Central

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          ref: ${{ github.event.inputs.ref_to_publish }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          cache: 'sbt'
          java-version: 17
          distribution: 'temurin'

      - name: .github/scripts/release
        run: |
          .github/scripts/release
        env:
          PGP_KEY_HEX: ${{ secrets.PGP_KEY_HEX }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          PUBLISH_STABLE_VERSION: ${{ github.event.inputs.stable_version }}
          RELEASE_REF: ${{ github.event.inputs.ref_to_publish }}

  publish_docs:
    name: Publish Website
    needs: [ publish_sonatype ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          ref: ${{ github.event.inputs.ref_to_publish }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          cache: 'sbt'
          java-version: 17
          distribution: 'temurin'

      - name: Generate Scaladoc website
        run: ./sbt -J-Xmx6144m ci-doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/scala-3.3.8/unidoc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
