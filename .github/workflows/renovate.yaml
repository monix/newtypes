name: Renovate

on:
  workflow_dispatch:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: "0 9 * * 1"

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        # env:
        #   LOG_LEVEL: debug
