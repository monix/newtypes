name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: ["v[0-9]+*"]

jobs:
  tests:
    name: Unit tests / JVM ${{ matrix.java }}
    strategy:
      fail-fast: false   
      matrix:
        os: [ubuntu-latest]
        java: [17, 21]
        command: ["ci-test-all"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          cache: 'sbt'
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: sbt ${{ matrix.command }}
        run: |
          ./sbt -J-Xmx6144m ${{ matrix.command }}

  doc-tests:
    name: Docs tests 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          cache: 'sbt'
          java-version: 17
          distribution: 'temurin'
      - name: sbt ci-doc
        run: |
          ./sbt -J-Xmx6144m ci-doc
  
  all_tests:
    name: All Tests
    needs: [ tests, doc-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Ack
        run: |
          echo "All done."
